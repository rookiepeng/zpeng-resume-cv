name: Build PDFs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch. Superseded runs on a feature branch are cancelled, but a
# run on master is left alone so it can finish deploying to Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: zpeng_cv.tex
          latexmk_use_xelatex: true
          working_directory: ./LaTeX
          # zpeng_style.tex loads IBM Plex behind \IfFileExists and silently
          # falls back to the class defaults when it is absent, which would
          # publish a PDF in the wrong typeface without failing. Catch it here.
          pre_compile: |
            kpsewhich plex-sans.sty > /dev/null || {
              echo "::error::plex-sans.sty is missing from this TeX Live image. The documents would build in a fallback typeface instead of IBM Plex Sans."
              exit 1
            }

      - name: Compile résumé
        uses: xu-cheng/latex-action@v4
        with:
          root_file: zpeng_resume.tex
          latexmk_use_xelatex: true
          working_directory: ./LaTeX

      # A mistyped \nocite key drops a publication from the CV without failing
      # the build, so an unresolved citation has to be treated as an error.
      - name: Check for unresolved citations and references
        working-directory: ./LaTeX
        run: |
          status=0
          for log in zpeng_cv.log zpeng_resume.log; do
            if [ ! -f "$log" ]; then
              echo "::error::$log not found; cannot verify references."
              status=1
              continue
            fi
            if grep -E "(Citation|Reference) .* undefined" "$log"; then
              echo "::error file=LaTeX/$log::Unresolved citations or references in $log"
              status=1
            fi
          done
          exit $status

      # The publication counts quoted in the prose (cv/facts.tex) and the
      # publications actually listed (the \nocite keys in cv/publications.tex)
      # are two different things that must agree. Nothing in LaTeX ties them
      # together, and a stale count is the kind of error that survives for years
      # because it never looks wrong. Tie them together here.
      - name: Check publication counts against the bibliography
        working-directory: ./LaTeX
        run: |
          python3 - <<'PY'
          import re, sys

          facts = open('cv/facts.tex').read()
          pubs = open('cv/publications.tex').read()

          def stated(macro):
              m = re.search(r'\\newcommand\{\\' + macro + r'\}\{(\d+)\}', facts)
              if not m:
                  sys.exit(f'cv/facts.tex does not define {macro}')
              return int(m.group(1))

          def listed(heading):
              # The \nocite in the refsection under the given \cvsubsection.
              m = re.search(re.escape('\\cvsubsection{' + heading + '}')
                            + r'.*?\\nocite\{([^}]*)\}', pubs, re.S)
              if not m:
                  sys.exit(f'cv/publications.tex has no \\nocite under "{heading}"')
              return len([k for k in m.group(1).split(',') if k.strip()])

          checks = [
              ('cvBooks',      'Book',                   'edited books'),
              ('cvChapters',   'Book Chapters',          'book chapters'),
              ('cvJournals',   'Journal Articles',       'journal articles'),
              ('cvConfPapers', 'Conference Proceedings', 'conference papers'),
              ('cvPatents',    'Patents',                'granted patents'),
          ]

          bad = False
          for macro, heading, label in checks:
              want, have = stated(macro), listed(heading)
              if want != have:
                  print(f'::error file=LaTeX/cv/facts.tex::{macro} says {want} '
                        f'{label}, but cv/publications.tex lists {have}')
                  bad = True
              else:
                  print(f'ok: {label} = {want}')
          sys.exit(1 if bad else 0)
          PY

      - name: Collect PDFs
        run: |
          mkdir -p pages
          cp ./LaTeX/zpeng_cv.pdf ./LaTeX/zpeng_resume.pdf ./pages/

      # Reporting only: page counts are the quickest way to spot that a content
      # edit has quietly pushed the résumé onto a third page. Never fail here.
      - name: Summarize output
        continue-on-error: true
        run: |
          command -v pdfinfo > /dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          }
          {
            echo "| Document | Pages | Size |"
            echo "| --- | ---: | ---: |"
            for pdf in pages/zpeng_resume.pdf pages/zpeng_cv.pdf; do
              printf '| %s | %s | %s |\n' \
                "$(basename "$pdf")" \
                "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')" \
                "$(du -h "$pdf" | cut -f1)"
            done
            echo
            printf 'Overfull boxes: %s\n' \
              "$(grep -hc 'Overfull \\hbox' LaTeX/zpeng_cv.log LaTeX/zpeng_resume.log \
                 | awk '{s+=$1} END {print s+0}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdfs-${{ github.sha }}
          path: ./pages/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
