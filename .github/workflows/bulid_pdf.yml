name: Build LaTeX document

on:
  push:
  workflow_dispatch:

# Allow the built PDFs to be published to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run finish rather than cancelling an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: zpeng_cv.tex
          latexmk_use_xelatex: true
          working_directory: ./LaTeX

      - name: Compile résumé
        uses: xu-cheng/latex-action@v3
        with:
          root_file: zpeng_resume.tex
          latexmk_use_xelatex: true
          working_directory: ./LaTeX

      - name: Collect PDFs
        run: |
          mkdir -p pages
          cp ./LaTeX/zpeng_cv.pdf ./LaTeX/zpeng_resume.pdf ./pages/

      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: ./pages/*.pdf

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
